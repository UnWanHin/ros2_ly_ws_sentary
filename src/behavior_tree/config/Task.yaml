behavior_tree:
  ros__parameters:
    StartGate:
      # Gate mode rule: before /ly/game/is_start=true, keep chassis velocity and rotate at zero.
      # This fallback is overridden by config/common.yaml when using scripts/start.sh.
      # This switch only allows gimbal patrol scan while waiting for game start.
      AllowGimbalPatrolBeforeStart: true
    Task:
      Buff: false
      Outpost: true
      OutpostConfirm:
        # 敵方前哨血量、自己血量/彈量等裁判資料超過這個時間未更新時，不主動進前哨任務。
        RefereeFreshTimeoutMs: 2000
        # false: 不把下位機刷來的 /ly/enemy/op_hp 當前哨存活/已毀 gate。
        # 這樣 op_hp=0 只當 unknown，前哨能靠 /ly/aim 目標和 visual scout 繼續進任務。
        TrustEnemyOutpostHp: false
        # 兼容原有邏輯：開局 120 秒內才主動打前哨；設 0 可關閉時間窗口。
        MaxGameTimeSec: 120
        # 低於這些資源門檻時不主動打前哨；資料不新鮮時不因 freshness 抖動退出，低血/低彈由 Hard Recovery 優先處理。
        MinSelfHp: 150
        MinAmmo: 30
        # op_hp 不能作為哨兵正式 gate；保留 op_hp 接口，但默認靠前哨視覺確認是否可打。
        # 未收到 op_hp 時會短時切到外部 aim 前哨目標去 BuffOutpost 偵查。
        # 若沒有收到 /ly/aim/result 的有效前哨結果，非開局窗口會超時並冷卻，避免長時間卡前哨任務。
        VisualScoutWithoutHp: true
        VisualScoutHoldMs: 40000
        VisualScoutCooldownMs: 15000
        # 接近 BuffOutpost 的參考距離；進入此距離後開正式前哨 FaceMode/no-target timeout。
        VisualScoutFaceDistanceCm: 300
        # 開局窗口後，允許低優先級週期回 BuffOutpost 短暫看前哨；會讓回防/戰術任務先做。
        PostWindowScoutEnable: true
        PostWindowScoutIntervalSec: 60
        # 接近 BuffOutpost 後短暫開 FaceMode 看前哨，避免長時間卡住巡邏。
        PostWindowScoutHoldMs: 3000
        # 打前哨時普通車體目標小於此距離才打斷前哨；更遠的車體先忽略，繼續前哨任務。
        ArmorWarningDistanceCm: 5000
        # 因近距離車體打斷後，車體丟失且仍允許前哨任務時，回前哨 FaceMode 搜索的時間。
        PostArmorFaceSearchMs: 5000
        # 前哨任務可被受擊打斷；與 Buff 不同，打前哨之後可再回來打。
        DamageAbortThreshold: 30
        DamageAbortWindowMs: 1000
        DamageAbortHoldMs: 3000
        # true: 開局 MaxGameTimeSec 內，前哨任務優先壓過普通 regional/protect 類導航任務。
        OpeningHighPriority: true
        # 開局硬駐守 BuffOutpost 的秒數；期間不受 VisualScoutHoldMs/PostWindowScoutHoldMs timeout 影響。
        OpeningHoldSec: 120
        # true: 開局 OpeningHoldSec 內，即使沒有搜到前哨目標也持續待在 BuffOutpost，不因 no-target timeout 釋放給 Default。
        OpeningHoldUntilWindowEnd: true
        # true: 前哨任務導航/偵查未結束時，看到車體仍可打，但不發布 chase 追車。
        SuppressChaseWhileActive: true
      BuffTimer:
        # false: 以裁判 0x020D sentry_info_2.bit14 can_activate 為準，能激活才去打。
        # true: 兼容定時窗口；窗口內進 Buff，仍只在到點且視覺鎖定後下發確認。
        Enable: false
        StartSec: 0
        EndSec: 25
        MaxShootCount: 15
      BuffConfirm:
        RefereeFreshTimeoutMs: 2000
        PulseMs: 500
        RetryIntervalMs: 2000
        # 裁判從「可激活」切到「正在激活」有回包延遲，確認後這段時間仍保持 Buff 並允許擊打。
        PostConfirmGraceMs: 3000
        # 避免裁判狀態丟失時永久卡在打符；正常成功會由 event_data=已激活 提前退出。
        TaskHoldTimeoutMs: 30000
        DamageAbortThreshold: 30
        DamageAbortWindowMs: 1000
        DamageAbortHoldMs: 5000
    FaceMode:
      # true: BT 在 Buff/Outpost 或區域任務請求朝向固定地圖點時，允許使用 /ly/face_mode/angles。
      Enable: true
      # FaceMode missing-angle PatrolScan fallback is configured in Patrol.yaml:
      # PatrolScan.TaskOverrides.FaceModeFallbackEnable / FaceModeFallbackMode / OutpostFaceModeFallbackMode.
