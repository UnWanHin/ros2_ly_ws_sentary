behavior_tree:
  ros__parameters:
    Tactical:
      # 城堡防守總開關；關閉時 RFID 與 MyBase 敵方座標兩條來源都不啟用。
      ProtectCastle:
        Enable: true
        # 我方基地实际血量严格下降后 8 秒内触发防守；虚拟护盾没有可用回读，不做推断。
        Base: true
        # 裁判 event_data 的己方堡壘增益點被占（status 2/3）來源。
        RFID: true
        # 對方占己方堡壘且裁判事件新鮮時，先去 Castle，抵達後不再離點追擊。
        StayWhenRfid: true
        # /ly/position/data 的敵方座標進入我方 MyBase 來源。
        EnemyPos: true
        # Castle 占领归因使用的位置新鲜度、边界余量和导航到达辅助窗口。
        OccupancyPositionFreshMs: 2500
        CastlePositionMarginCm: 60
        ArrivalConfirmGraceMs: 3000

      # 控制己方 Hero 位於高地/ProtectHero 區域時的戰術保護站位。
      ProtectHero:
        Enable: true

      DamageRotate:
        # 全域底盤小陀螺預設。
        DefaultGear: 0
        # 最後一次受擊超過此時間後，回到 DefaultGear。
        NoHitTimeoutMs: 1800
        # 受擊 ramp：先保持 0 檔，再依序進入 1、2、3 檔。
        Gear0HoldMs: 220
        Gear1HoldMs: 220
        Gear2HoldMs: 220
        # 無目標受擊期間的雲台掃描加速與抖掃方向切換。
        ScanBoostWindowMs: 1300
        ScanYawPhaseMs: 160
