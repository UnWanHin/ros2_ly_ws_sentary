behavior_tree:
  ros__parameters:
    Tactical:
      # Tactical task arbitration: lower number has higher priority. Hard and
      # Task layers stay above this table; Buff/Outpost aim tasks are unchanged.
      Priority:
        ProtectCastle: 1
        ProtectOutpost: 2
        ProtectHero: 3
        Chase: 4

      # 强化姿态的统一保护；TypeID 7/10 分帧短暂不同步不立即判故障。
      EnhancedPosture:
        ContradictionGraceMs: 500
        RecoveryMove:
          # 仅 Regional 的低血量 Recovery 行进段可申请姿态 6。
          Enable: true
          HealthThresholdHp: 80
          # 裁判正常读条复活(0 -> 正血)后不立即浪费强化移动。
          RespawnSuppressSec: 30

      # 城堡防守總開關；關閉時 RFID 與 MyBase 敵方座標兩條來源都不啟用。
      ProtectCastle:
        Enable: true
        # 我方基地实际血量严格下降后 8 秒内触发防守；虚拟护盾没有可用回读，不做推断。
        Base: true
        # 裁判 event_data 的己方堡壘增益點被占（status 2/3）來源。
        RFID: true
        # 對方占己方堡壘且裁判事件新鮮時，先去 Castle，抵達後不再離點追擊。
        # 只有 RFID 證實本車完成 0/2 -> 1/3 轉換時才站樁；其餘我方/雙方占領守四個外圍點。
        StayWhenRfid: true
        # /ly/position/data 的敵方座標進入我方 MyBase 來源。
        EnemyPos: true
        # Castle 占领归因使用的位置新鲜度、边界余量和导航到达辅助窗口。
        OccupancyPositionFreshMs: 2500
        CastlePositionMarginCm: 60
        ArrivalConfirmGraceMs: 3000
        # 仅当我方堡垒 RFID 已有效时，裁判占领状态由 0/2 转成 1/3 的最大确认窗口。
        # 用于归因“本哨兵完成占领”，不是 event_data 或 RFID 本身的新鲜度。
        RfidCaptureTransitionWindowMs: 3000

      # 我方前哨血量在窗口內累積下降達門檻時，前往官方 C3/C4；0 HP 立即取消。
      ProtectOutpost:
        Enable: true
        HealthFreshMs: 2000
        DamageWindowMs: 2000
        DamageThresholdHp: 20
        SearchHoldSec: 30
        UnreachableCooldownSec: 10

      # 己方 Hero 位於高地/ProtectHero 區域時的戰術保護站位。此處是正式運行時
      # 的唯一權威；舊 JSON HeroProtection 僅在未提供這些 YAML 欄位時作相容基線。
      ProtectHero:
        Enable: true
        # Hero 資料新鮮、存活且在 Highland/ProtectHero 區域時，預先駐守 Highland；
        # 不等待敵方進入。關閉時恢復舊行為，需同時有我方 Base 與 Highland 敵情才觸發。
        ProactiveHoldWhenHeroInHighland: true
        # 到守護點先維持普通防守。只有這個窗口內累積扣血達門檻時，才嘗試姿態 5。
        # 強防只在 TypeID 10 剩餘時間新鮮且大於 0 時發出；其他情況維持姿態 2。
        EnhancedDefense:
          Enable: true
          DamageWindowMs: 1500
          DamageThresholdHp: 30
        # 比賽開始後達此秒數才可觸發；0 表示開局立即允許。
        StartElapsedSec: 120
        # 保護導航目標的最長重發保持時間（秒）。
        HoldSec: 30
        # 僅在 ProactiveHoldWhenHeroInHighland=false 的舊敵情模式中：已啟動後，
        # 連續沒有任何 RegionalDefense 敵情多久才釋放（秒）。
        NoEnemyReleaseSec: 8
        # Hero 官方位置、血量的最大可接受資料年齡（毫秒）。
        FriendPositionFreshMs: 2500
        FriendHealthFreshMs: 2500
        # 守護目標的 base goal；預設 Highland。
        GoalBaseId: 8

      DamageRotate:
        # 全域底盤小陀螺預設。
        DefaultGear: 0
        # 最後一次受擊超過此時間後，回到 DefaultGear。
        NoHitTimeoutMs: 1800
        # 受擊 ramp：先保持 0 檔，再依序進入 1、2、3 檔。
        Gear0HoldMs: 1000
        Gear1HoldMs: 1000
        Gear2HoldMs: 1000
        # 無目標受擊期間的雲台掃描加速與抖掃方向切換。
        ScanBoostWindowMs: 1300
        ScanYawPhaseMs: 160
