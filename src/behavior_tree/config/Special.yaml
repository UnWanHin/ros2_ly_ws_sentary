behavior_tree:
  ros__parameters:
    Special:
      # Optional regional layer between Tactical and Default.
      # MiniRoadland ignores MyArea.Roadland scope and only commands the own-team goal.
      MiniRoadland:
        Enable: false
        GoalBaseId: 25
        GoalHoldSec: 6
        SpeedLevel: 1
      # CentralLeft two-endpoint tactical line patrol. SuppressChase keeps locked targets from
      # converting into navigation chase inside this constrained terrain.
      Patrol:
        Enable: false
        GoalHoldSec: 2
        SpeedLevel: 1
        SuppressChase: true
        StopOnTarget: true
