# Temporary Aim target override. Disabled by default so each competition
# profile keeps its JSON AimTargetPriority/AimTargetIgnore baseline.
behavior_tree:
  ros__parameters:
    Aim:
      Override:
        Enable: true
        # ArmorType IDs, ordered from highest to lowest fallback priority.
        # When Enable=true, a provided list replaces the JSON list.
        TargetPriority: [1, 3, 4, 6, 2]
        # ArmorType IDs excluded from fallback selection and external target use.
        # An empty list explicitly clears the JSON ignore list.
        TargetIgnore: [2]
