behavior_tree:
  ros__parameters:
    AreaManager:
      RegionalAreaTask:
        # Common weighted patrol scoring. score starts from point weight, then adds
        # exploration/freshness bonuses and distance/recent/current penalties.
        PatrolSelection:
          DistancePenaltyPerMeter: 0.4
          CurrentGoalPenalty: 5.0
          AvoidCurrentGoal: true
          UnvisitedBonus: 12.0
          FreshnessBonusMax: 12.0
          FreshnessTimeoutSec: 120
          RecentVisitPenalty: 8.0
          RecentVisitPenaltySec: 30
        MyBase:
          # Seconds to stay after reaching the selected Base patrol goal before scoring the next one.
          GoalHoldSec: 15
          Patrol:
            # Set a goal weight to 0 to disable that candidate. Scoring knobs are
            # shared under RegionalAreaTask.PatrolSelection.
            GoalWeights:
              CastleLeft1: 9.0
              CastleLeft2: 7.0
              CastleRight2: 8.0
              CastleRight1: 7.0
              HoleRoad: 12.0
              OutpostGuard: 16.0
              BuffOutpost: 12.0
