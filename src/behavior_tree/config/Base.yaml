behavior_tree:
  ros__parameters:
    AreaManager:
      RegionalAreaTask:
        MyBase:
          # Seconds to stay after reaching the selected Base patrol goal before scoring the next one.
          GoalHoldSec: 15
          Patrol:
            # score = weight - distance_m * DistancePenaltyPerMeter.
            # CurrentGoalPenalty is applied when the selector must consider the current point.
            # Set a goal weight to 0 to disable that candidate.
            DistancePenaltyPerMeter: 0.4
            CurrentGoalPenalty: 5.0
            GoalWeights:
              CastleLeft1: 9.0
              CastleLeft2: 7.0
              CastleRight2: 8.0
              CastleRight1: 7.0
              HoleRoad: 12.0
              OutpostGuard: 16.0
              BuffOutpost: 12.0
