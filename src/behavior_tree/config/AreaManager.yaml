behavior_tree:
  ros__parameters:
    AreaManager:
      Switch_Point: false
      Area:
        # true: going to BuffOutpost first routes through HoleRoad; leaving BuffOutpost to other own goals also routes through HoleRoad.
        BuffOutpostCompat:
          Enable: false
          TimeoutSec: 6
      SentryPositionFusion:
        Enable: true
        Mode: priority   # priority or weighted
        FreshTimeoutMs: 2000
        Sources:
          Uwb:
            Enable: true
            Priority: 0
            Weight: 1.0
            FreshTimeoutMs: 0
          PositionData:
            Enable: true
            Priority: 2
            Weight: 0.7
            FreshTimeoutMs: 0
          Navi:
            Enable: true
            Priority: 1
            Weight: 0.8
            FreshTimeoutMs: 0
      RegionalAreaTask:
        Enable: true
        # Common weighted patrol scoring. MyBase uses this now; future patrol tasks
        # should reuse the same block and keep only their point weights locally.
        PatrolSelection:
          DistancePenaltyPerMeter: 0.4
          CurrentGoalPenalty: 5.0
          AvoidCurrentGoal: true
          UnvisitedBonus: 12.0
          FreshnessBonusMax: 12.0
          FreshnessTimeoutSec: 120
          RecentVisitPenalty: 8.0
          RecentVisitPenaltySec: 30
        MyBase:
          Enable: true
          TravelTimeoutSec: 12
          CommandHoldSec: 1
          MaxPatrolSteps: 4
        MyHighland:
          Enable: true
          UseFaceMode: false
          ApproachTimeoutSec: 8
          HighlandPatrolHoldSec: 2
          BuffShootTravelTimeoutSec: 8
          BuffShootHoldSec: 10
          LeaveTimeoutSec: 8
        MyRoadland:
          Enable: true
          UseFaceMode: false
          TravelTimeoutSec: 12
          CrossTimeoutSec: 8
          CommandHoldSec: 1
          GuardHoldSec: 2
          FaceTargetZCm: 100
          HealthyHpMin: 300
          HealthyAmmoMin: 50
        CommonCentral:
          Enable: true
          TravelTimeoutSec: 12
          CommandHoldSec: 1
          MaxPatrolSteps: 8
          HealthyHpMin: 300
          HealthyAmmoMin: 50
      DefaultPolicy:
        Enable: true
        Health:
          MyAreaHpMin: 250
          CommonCentralHpMin: 300
          EnemyAreaHpMin: 350
          LowResourceFallbackHp: 250
        Ammo:
          MyAreaAmmoMin: 50
          CommonCentralAmmoMin: 50
          EnemyAreaAmmoMin: 80
          LowResourceFallbackAmmo: 30
        Score:
          WeightMyBase: 10.0
          WeightMyHighland: 8.0
          WeightMyRoadland: 7.0
          WeightCommonCentral: 6.0
          WeightEnemyBase: 4.0
          WeightEnemyHighland: 4.0
          WeightEnemyRoadland: 4.0
          DistancePenaltyPerMeter: 0.4
          CurrentAreaPenalty: 2.0
          LastAreaPenalty: 1.0
          AfterHighlandMyBaseBonus: 5.0
          AfterHighlandMyRoadlandBonus: 3.0
          LowResourceMyBaseBonus: 4.0
        Retry:
          CompleteCooldownSec: 2
          FailureCooldownSec: 8
          UnreachableCooldownSec: 12
          MaxRetry: 2
