behavior_tree:
  ros__parameters:
    AreaManager:
      # 只切換官方點位/區域查找的紅藍映射，不交換 team 語義或 goal ID。
      SwitchPoint: false

      # 比賽時可直接切換的正式區域任務開關。
      # false 會讓 Default 不再選擇該區域，正在執行的同類區域任務也會退出。
      RegionalAreaTask:
        Enable: true
        MyBase:
          Enable: true
        MyHighland:
          Enable: true
        MyPreRoadland:
          Enable: true
        MyReadyRoadland:
          Enable: false
        CommonCentral:
          Enable: false

      # 自身位置融合：UWB 優先，其次導航，再其次底盤 PositionData。
      SentryPositionFusion:
        Enable: true
        Mode: priority
        FreshTimeoutMs: 2000
        Sources:
          Uwb:
            Enable: true
            Priority: 0
            Weight: 1.0
            FreshTimeoutMs: 0
          PositionData:
            Enable: true
            Priority: 2
            Weight: 0.7
            FreshTimeoutMs: 0
          Navi:
            Enable: true
            Priority: 1
            Weight: 0.8
            FreshTimeoutMs: 0

      BuffOutpostCompat:
        Enable: false
        TimeoutSec: 6
