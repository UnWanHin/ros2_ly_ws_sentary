behavior_tree:
  ros__parameters:
    PatrolScan:
      # 无任务覆盖时的默认巡逻模式：1 单向偏航，2 摆动扫描，3 前哨高仰角扫描。
      Mode: 2

      Mode1:
        YawStepDegPerTick: 9.0  # 每个 BT tick 的偏航增量（度）。
        YawBoostStepDegPerTick: 10.0  # 加速扫描时每 tick 的偏航增量（度）。
        PitchCenterDeg: 5.0  # 俯仰扫描中心角（度）。
        PitchHalfRangeDeg: 15.0  # 俯仰正弦扫描半幅（度）。
        PitchPeriodMs: 2000.0  # 俯仰完整周期（毫秒），越小越快。

      Mode2:
        # 摆动扫描模式。
        YawStepDegPerTick: 0.7  # 每 tick 的偏航步长（度）。
        YawBoostStepDegPerTick: 1.1  # 加速扫描时每 tick 的偏航步长（度）。
        YawHalfRangeDeg: 40.0  # 偏航左右摆动半幅（度）。
        CenterDriftPerCycleDeg: -70.0  # 每轮摆动后中心角漂移（度）。
        PitchCenterDeg: 5.0  # 俯仰扫描中心角（度）。
        PitchHalfRangeDeg: 14.0  # 俯仰正弦扫描半幅（度）。
        PitchPeriodMs: 700.0  # 俯仰完整周期（毫秒）。
        ResumeYawToleranceDeg: 1.0  # 目标/FaceMode 释放后恢复保存轨迹的回授偏航容差（度）。
        ResumeMaxMs: 800  # 未能回到保存轨迹时的最大等待；超时后以当前回授角重新开始 mode2。

      Mode3:
        # 前哨高仰角扫描：Pitch = offset + half_range * sin(t / period)。
        YawStepDegPerTick: 6.0  # 每 tick 的偏航步长（度）。
        PitchOffsetDeg: 0.0  # 俯仰基准偏置（度）。
        PitchHalfRangeDeg: 12.0  # 俯仰扫描半幅（度）；设为 0 则固定俯仰。
        PitchPeriodMs: 2000.0  # 俯仰完整周期（毫秒）。

      # 固定点 FaceMode 与无目标 Patrol 的最终角度输出共用此平滑器；
      # 视觉 Aim 不经过此限制，避免降低追踪响应。
      PassiveMotion:
        YawRateDegPerSec: 120.0
        PitchRateDegPerSec: 60.0
        MaxIntervalMs: 25  # BT 单拍阻塞时也不允许补发大角度跳变。

      TaskOverrides:
        # 已请求 FaceMode 但 /ly/face_mode/angles 缺失时，回退到云台巡逻。
        FaceModeFallbackEnable: true  # 是否启用该 FaceMode 缺失回退。
        FaceModeFallbackMode: 2  # 一般 FaceMode 缺失时使用的巡逻模式。
        OutpostFaceModeFallbackMode: 2  # 前哨 FaceMode 缺失时使用的巡逻模式。

        OutpostDamageAbortMode: 2  # 前哨受击中断后搜索所用巡逻模式，不受默认 Mode 影响。

        StartGatePitchOffsetDeg: 10.0  # 比赛开始前巡逻额外抬高的俯仰角（度）。
        StartGatePitchOffsetApplyToMode3: false  # 是否也对模式 3 叠加开局俯仰偏置。

        OutpostPitchOffsetDeg: 15.0  # 前哨未发现目标时额外抬高的俯仰角（度）。
        OutpostPitchOffsetApplyToMode3: false  # 是否也对模式 3 叠加前哨俯仰偏置。
