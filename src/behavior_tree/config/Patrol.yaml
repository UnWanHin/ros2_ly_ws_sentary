behavior_tree:
  ros__parameters:
    PatrolScan:
      # Default fallback scan mode used when no specific task override applies.
      # 1 = single-direction yaw scan, 2 = swing scan, 3 = outpost high scan.
      Mode: 1

      Mode1:
        # Degrees added to yaw every BT tick. Actual angular speed also depends on Rate.TreeTickRate.
        YawStepDegPerTick: 9.0
        YawBoostStepDegPerTick: 10.0
        PitchCenterDeg: 5.0
        PitchHalfRangeDeg: 15.0
        # Full pitch sine-wave period in milliseconds. Smaller = faster pitch movement.
        PitchPeriodMs: 2000.0

      Mode2:
        # Swing mode yaw/pitch scan.
        YawStepDegPerTick: 1.0
        YawBoostStepDegPerTick: 1.1
        YawHalfRangeDeg: 30.0
        CenterDriftPerCycleDeg: -70.0
        PitchCenterDeg: 0.0
        PitchHalfRangeDeg: 13.0
        PitchPeriodMs: 500.0

      Mode3:
        # High-pitch scan profile. Pitch = offset + half_range * sin(t / period).
        YawStepDegPerTick: 6.0
        PitchOffsetDeg: 0.0
        # Set 0.0 to keep a fixed high pitch.
        PitchHalfRangeDeg: 12.0
        PitchPeriodMs: 2000.0

      TaskOverrides:
        # FaceMode requested but /ly/face_mode/angles is missing: fallback to PatrolScan.
        FaceModeFallbackEnable: true
        FaceModeFallbackMode: 2
        OutpostFaceModeFallbackMode: 2

        # Outpost task damage-abort search uses a deterministic patrol mode instead of
        # whichever default PatrolScan.Mode is selected by the competition profile.
        OutpostDamageAbortMode: 2

        # Start-gate scan keeps chassis/fire stopped but raises scan pitch before game start.
        StartGatePitchOffsetDeg: 10.0
        StartGatePitchOffsetApplyToMode3: false

        # Outpost no-target scan keeps the selected mode yaw curve and raises pitch.
        OutpostPitchOffsetDeg: 15.0
        OutpostPitchOffsetApplyToMode3: false
