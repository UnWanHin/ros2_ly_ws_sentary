/**:
  ros__parameters:
    # 串口/下位机基线参数，仅由 gimbal_driver 读取。
    io_config:
      use_virtual_device: false  # 是否使用虚拟串口设备。
      device_name: "/dev/ttyACM0"  # 实际下位机串口设备。
      baud_rate: 115200  # 串口波特率。
      posture_repeat_count: 3  # 姿态命令连续下发次数。
      posture_repeat_interval_ms: 20  # 姿态重复下发间隔（毫秒）。
      firecode_partial_hold_ms: 100  # FireCode 局部更新字段保持时间（毫秒）。
      velocity_raw_to_mps: 0.025  # 导航 raw 速度到控制速度的换算系数（米/秒）。
      # /ly/game/path 的 header.stamp 超过此时效即不再下发；driver 不会周期性重发缓存路径。
      game_path_fresh_timeout_ms: 5000  # 地图路径新鲜度（毫秒）。
      gimbal_dynamics_timeout_ms: 200  # TypeID 11 动态反馈超时后仅清零动态字段。
      gimbal_state_publish_period_ms: 20  # /ly/gimbal/state 周期发布间隔（毫秒）。
      sentry_coord_send_interval_ms: 100  # 自身坐标下发间隔（毫秒）。
      sentry_coord_field_width_x: 2800  # 裁判小地图 X 场地宽度（厘米）。
      sentry_coord_field_width_y: 1500  # 裁判小地图 Y 场地宽度（厘米）。
      sentry_coord_fresh_timeout_ms: 2000  # 自身坐标输入新鲜度（毫秒）。

      # gimbal_driver.launch.py 默认不覆盖这些 raw 配置；只有命令行显式传
      # raw_log_enable:=... / raw_topic_enable:=... 时才会覆盖这里。
      # 串口原始帧文件日志：会把上下行帧转成 hex 写入文件，必要时才打开。
      # raw_serial_log_screen=true 会把每帧也打印到终端，调试方便但不建议长期开。
      # raw_serial_log_type_ids 只过滤下位机->上位机的上行 TypeID；下行由 raw_serial_log_downlink 控制。
      raw_serial_log_enable: false
      raw_serial_log_uplink: true
      raw_serial_log_downlink: true
      raw_serial_log_screen: false
      raw_serial_log_flush: true
      raw_serial_log_dir: "~/Log/GimbalRaw"
      raw_serial_log_type_ids: "all"

      # 旧聚合 raw topic：/ly/log/gimbal_raw_rx、/ly/log/gimbal_raw_tx。
      # 仅为兼容旧调试工具保留；推荐使用下面 serial_mode 的按协议 ID topic。
      raw_serial_topic_enable: false
      raw_serial_topic_uplink: true
      raw_serial_topic_downlink: false
      raw_serial_topic_type_ids: "all"

      # 按协议 ID 发布带 header.stamp 的原始帧。false 时不创建这些 publisher。
      # 语义 topic（/ly/game/*、/ly/gimbal/* 等）独立保留，不受此开关影响。
      # 每个 raw topic 仅在实际有 subscriber 时才组包发布。
      serial_mode: false
      upload:
        enable: true  # /ly/upload/typeidN 的方向总开关。
        typeid0: true
        typeid1: true
        typeid2: true
        typeid3: true
        typeid4: true
        typeid5: true
        typeid6: true
        typeid7: true
        typeid8: true
        typeid9: true
        typeid10: true
        typeid11: true
      download:
        enable: true  # /ly/download/typeid0xNN 的方向总开关。
        typeid0x00: true  # 0x00 GimbalControlFrame。
        typeid0x01: true  # 0x01 SentryCommandFrame。
        typeid0x02: true  # 0x02 MapPathFrame / 0x0307。
        typeid0x03: true  # 0x03 CustomInfoFrame / 0x0308。
        typeid0x04: true  # 0x04 SentryCoordinateFrame。
        typeid0x05: true  # 0x05 GimbalTrajectoryFrame。
