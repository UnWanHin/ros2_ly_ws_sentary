/**:
  ros__parameters:
    # Single-node navigation direct-debug profile. Do not load from sentry_all.
    io_config:
      navigation_mode:
        enabled: true  # Subscribe to navigation debug controls.
        vel_chain: true  # Directly write /ly/navi/vel to the lower-machine frame.
        rotate_level: 1  # Default Rotate level, range 0..3.
        should_rotate:
          enabled: true  # Consume /ly/navi/should_rotate.
      navigation_test_stale_timeout_ms: 500  # Direct-velocity stale timeout (ms).
    # Slash key is required for the driver's compatibility reader and overlay precedence.
    io_config/navigation_mode/should_rotate/follow_mode_when_false: true
