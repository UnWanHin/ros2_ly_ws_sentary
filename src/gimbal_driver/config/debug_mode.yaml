/**:
  ros__parameters:
    # Single-node debug profile. Do not load from sentry_all or run beside BT.
    # The bridge is the only debug owner of the formal /ly/control/* topics;
    # gimbal_driver itself stays on the formal control subscriber path.
    navi_mode: true  # Enable /ly/navi/vel and /ly/navi/should_rotate input.
    aim_mode: true  # Enable formal /ly/aim/result -> angles/AimMode/fire output.
    rotate_level: 0
    follow_mode_when_false: true
    stale_timeout_ms: 500
    publish_hz: 100.0
    patrol: false  # Use canonical Patrol.yaml only while no fresh valid aim exists.
