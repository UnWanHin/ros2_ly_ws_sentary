schema: ly_simulator_tactical_catalog_v1

field:
  width_cm: 2800
  height_cm: 1500
  frame: left_bottom_origin_cm

visual:
  asset_manifest: assets/manifest.yaml
  unit_scale_px: 42
  trace_unit_scale_px: 34
  drag_unit_scale_px: 46
  health_bar_height_px: 5
  label_rule: compact_role
  team_colors:
    red: "#e85d5d"
    blue: "#5d8ee8"

ros_projection:
  # PositionData carries relative IDs: friend uses the base car ID and enemy
  # uses the same base car ID plus 100. Consumers must call the catalog
  # resolver instead of recreating this protocol rule.
  position_data:
    friend_car_id_offset: 0
    enemy_car_id_offset: 100

# Each archetype maps one semantic robot class to the existing formal Health
# and PositionData conventions. Drone publishes PositionData but has neither a
# Health field nor a behavior-tree decision consumer.
units:
  - key: hero
    label: Hero
    asset_key: Hero
    default_hp: 200
    max_hp: 200
    health_field: hero
    position_car_id: 1
    project_to_ros: true
    decision_consumed: true
  - key: engineer
    label: Engineer
    asset_key: Engineer
    default_hp: 250
    max_hp: 250
    health_field: engineer
    position_car_id: 2
    project_to_ros: true
    decision_consumed: true
  - key: infantry1
    label: Infantry1
    asset_key: Infantry1
    default_hp: 200
    max_hp: 200
    health_field: infantry1
    position_car_id: 3
    project_to_ros: true
    decision_consumed: true
  - key: infantry2
    label: Infantry2
    asset_key: Infantry2
    default_hp: 200
    max_hp: 200
    health_field: infantry2
    position_car_id: 4
    project_to_ros: true
    decision_consumed: true
  - key: infantry3
    label: Infantry3
    asset_key: Infantry3
    default_hp: 200
    max_hp: 200
    health_field: reserve
    position_car_id: 5
    project_to_ros: true
    decision_consumed: false
  - key: drone
    label: Drone
    asset_key: Drone
    default_hp: 150
    max_hp: 150
    health_field: null
    position_car_id: 6
    project_to_ros: true
    decision_consumed: false
  - key: sentry
    label: Sentry
    asset_key: Sentry
    default_hp: 400
    max_hp: 400
    health_field: sentry
    position_car_id: 7
    project_to_ros: true
    decision_consumed: true

# Positions are physical field-side positions. A scene resolves friend/enemy
# through the selected team rather than duplicating red and blue structure IDs.
structures:
  - key: friend_outpost
    label: Friend Outpost
    side: friend
    kind: outpost
    default_hp: 60
    max_hp: 60
    step: 10
    health_topic: /ly/friend/op_hp
    positions_cm:
      red: [1090, 370]
      blue: [1707, 1141]
  - key: enemy_outpost
    label: Enemy Outpost
    side: enemy
    kind: outpost
    default_hp: 60
    max_hp: 60
    step: 10
    health_topic: /ly/enemy/op_hp
    positions_cm:
      red: [1090, 370]
      blue: [1707, 1141]
  - key: friend_base
    label: Friend Base
    side: friend
    kind: base
    default_hp: 5000
    max_hp: 5000
    step: 500
    health_topic: /ly/friend/base_hp
    positions_cm:
      red: [245, 750]
      blue: [2555, 750]
  - key: enemy_base
    label: Enemy Base
    side: enemy
    kind: base
    default_hp: 5000
    max_hp: 5000
    step: 500
    health_topic: /ly/enemy/base_hp
    positions_cm:
      red: [245, 750]
      blue: [2555, 750]

