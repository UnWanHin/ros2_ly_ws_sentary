schema: ly_simulator_config_v1
updated: "2026-07-13"

window:
  width: 1500
  height: 900
  min_width: 960
  min_height: 620
  panel_width: 390
  timeline_height: 92
  fps: 60
  start_paused: false
  playback_speed: 1.0
  show_point_labels: false

paths:
  default_map: tools/maps/basemaps/buff_map_field.png
  sample_trace: sample/sample_trace.jsonl

assets:
  enabled: true
  manifest: assets/manifest.yaml
  unit_size_px: 42
  trace_unit_size_px: 34
  drag_unit_size_px: 46

web_stream:
  enabled: true
  host: 0.0.0.0
  port: 9000 #自定義的端口127.0.0.0:<ports>
  fps: 12.0
  jpeg_quality: 80

match_control:
  enabled: true
  mode: rmuc_super_confrontation_regional
  duration_sec: 420
  rewind_step_sec: 10
  forward_step_sec: 10
  control_file: /tmp/simulator_match_control.jsonl

ros_monitor:
  state_file: /tmp/simulator_ros_topics.json
  poll_sec: 0.05
  stale_sec: 1.0

field_cm:
  width: 2800
  height: 1500
  frame: left_bottom_origin_cm

timeline:
  path_history_limit: 500
  jump_step: 25

map_tags:
  goal_tags_expanded: false
  hover_goal_tags: true
  hover_radius_px: 18

scripted_path:
  enabled: false
  side: auto            # auto/red/blue
  speed_cmps: 140       # cm/s 調的gui速度，差不多就好了
  loop: true
  show_labels: false
  show_future: false
  label: SimPath
  line_width: 3
  marker_radius: 8
  color: "#f5c542"
  # priority: points_cm > goal_ids
  points_cm: []
  goal_ids: [0, 6, 10, 14, 17, 10, 6]

resources:
  ammo_max: 50

layers:
  terrain: true
  structures: true
  simulator_inputs: true
  grid: true
  all_goals: true
  current_goal: true
  goal_path: true
  scripted_path: true
  units: true
  unit_health_bars: true
  recent_changes: true

colors:
  bg: "#101216"
  panel: "#1b2026"
  panel2: "#252b33"
  text: "#edf2f7"
  muted: "#a8b0ba"
  line: "#3a424d"
  accent: "#f5c542"
  friend: "#4cc38a"
  enemy: "#e85d5d"
  neutral: "#4fb3d9"
  red: "#e85d5d"
  blue: "#5d8ee8"
  black: "#000000"
  white: "#ffffff"

simulator_inputs:
  enabled: true
  show_trace_units_with_scene: false
  unit_scene_file: ""
  structure_positions:
    outpost:
      red: [1090, 370]
      blue: [1707, 1141]
    base:
      red: [245, 750]
      blue: [2555, 750]
  structures:
    - {key: enemy_outpost, label: Enemy Outpost, side: enemy, structure: outpost, hp: 60, max_hp: 60, step: 10}
    - {key: enemy_base, label: Enemy Base, side: enemy, structure: base, hp: 5000, max_hp: 5000, step: 500}
    - {key: friend_outpost, label: Friend Outpost, side: friend, structure: outpost, hp: 60, max_hp: 60, step: 10}
    - {key: friend_base, label: Friend Base, side: friend, structure: base, hp: 5000, max_hp: 5000, step: 500}
  unit_palette:
    - {side: friend, type_id: 1, type: Hero, hp: 200, max_hp: 200}
    - {side: friend, type_id: 2, type: Engineer, hp: 250, max_hp: 250}
    - {side: friend, type_id: 3, type: Infantry1, hp: 200, max_hp: 200}
    - {side: friend, type_id: 4, type: Infantry2, hp: 200, max_hp: 200}
    - {side: friend, type_id: 5, type: Infantry3, hp: 200, max_hp: 200}
    - {side: friend, type_id: 6, type: Drone, hp: 150, max_hp: 150}
    - {side: friend, type_id: 7, type: Sentry, hp: 400, max_hp: 400}
    - {side: enemy, type_id: 1, type: Hero, hp: 200, max_hp: 200}
    - {side: enemy, type_id: 2, type: Engineer, hp: 250, max_hp: 250}
    - {side: enemy, type_id: 3, type: Infantry1, hp: 200, max_hp: 200}
    - {side: enemy, type_id: 4, type: Infantry2, hp: 200, max_hp: 200}
    - {side: enemy, type_id: 5, type: Infantry3, hp: 200, max_hp: 200}
    - {side: enemy, type_id: 6, type: Drone, hp: 150, max_hp: 150}
    - {side: enemy, type_id: 7, type: Sentry, hp: 400, max_hp: 400}

terrain:
  enabled: true
  source: visual_estimate_from_buff_map_field
  note: Approximate 2D elevation overlay. Confirm with official CAD/rules before using for path-cost decisions.
  show_labels: false
  levels:
    high:
      label: high
      color: "#f5c542"
      alpha: 42
      outline: "#f5c542"
      outline_alpha: 135
    ramp:
      label: ramp
      color: "#4fb3d9"
      alpha: 34
      outline: "#4fb3d9"
      outline_alpha: 120
  zones:
    - {name: RedLeftHighLand, level: high, rect: [300, 1235, 230, 180]}
    - {name: BlueLeftHighLand, level: high, rect: [2270, 85, 230, 180]}
    - {name: RedBuffPlatform, level: high, rect: [825, 1295, 210, 155]}
    - {name: BlueBuffPlatform, level: high, rect: [1765, 50, 210, 155]}
    - {name: RedCastleRamp, level: ramp, rect: [610, 700, 285, 310]}
    - {name: BlueCastleRamp, level: ramp, rect: [1905, 485, 285, 310]}
    - {name: CenterPlatform, level: high, rect: [1180, 620, 450, 260]}

structures:
  enabled: true
  source: rules_v1.4.1_plus_map_visual_alignment
  note: >
    Key structures are annotated for offline decision review. Geometry is approximate to map artwork and should be
    refined with official CAD alignment if used for precise navigation constraints.
  show_labels: false
  styles:
    wall:
      fill: "#7b8794"
      alpha: 34
      outline: "#a7b2be"
      outline_alpha: 128
    energy_mechanism:
      fill: "#f59e0b"
      alpha: 52
      outline: "#facc15"
      outline_alpha: 150
    outpost:
      fill: "#ec4899"
      alpha: 50
      outline: "#f472b6"
      outline_alpha: 150
    main_area:
      fill: "#a78bfa"
      alpha: 26
      outline: "#c4b5fd"
      outline_alpha: 150
    special_zone:
      fill: "#38bdf8"
      alpha: 30
      outline: "#7dd3fc"
      outline_alpha: 150
    settle_zone:
      fill: "#f59e0b"
      alpha: 28
      outline: "#fbbf24"
      outline_alpha: 150
  items:
    # Walls (major visual barriers / tunnel-style blocks)
    - {name: Wall.CenterCore, kind: wall, rect: [1200, 600, 420, 300]}
    - {name: Wall.RoadTunnelLower, kind: wall, rect: [820, 40, 360, 190]}
    - {name: Wall.RoadTunnelUpper, kind: wall, rect: [1620, 1260, 360, 190]}
    - {name: Wall.LeftMidBlock, kind: wall, rect: [360, 640, 210, 250]}
    - {name: Wall.RightMidBlock, kind: wall, rect: [2230, 610, 210, 250]}
    # Energy mechanism and outposts (rules 4.3.2.2 / 4.3.2.3)
    - {name: EnergyMechanism.Center, kind: energy_mechanism, shape: circle, center: [1400, 760], radius: 115}
    - {name: Outpost.RedSide, kind: outpost, shape: circle, center: [1090, 370], radius: 95}
    - {name: Outpost.BlueSide, kind: outpost, shape: circle, center: [1707, 1141], radius: 95}
    # Formal Regional main areas: PreRoadland is the front segment and ReadyRoadland is the rear segment.
    - {name: ReadyRoadland.Red, kind: main_area, polygon: [[510, 235], [510, 19], [1251, 17], [1333, 221]]}
    - {name: ReadyRoadland.Blue, kind: main_area, polygon: [[2290, 1265], [2290, 1481], [1549, 1483], [1467, 1279]]}
    - {name: PreRoadland.Red, kind: main_area, polygon: [[687, 380], [758, 235], [510, 235], [510, 205], [510, 19], [389, 15], [391, 373]]}
    - {name: PreRoadland.Blue, kind: main_area, polygon: [[2113, 1120], [2042, 1265], [2290, 1265], [2290, 1295], [2290, 1481], [2411, 1485], [2409, 1127]]}
    - {name: Recovery.Red, kind: special_zone, polygon: [[109, 286], [306, 292], [304, 205], [111, 208]]}
    - {name: Recovery.Blue, kind: special_zone, polygon: [[2691, 1214], [2494, 1208], [2496, 1295], [2689, 1292]]}
    - {name: CentralLeft.Red, kind: special_zone, shape: polyline, polyline: [[1205, 1260], [1026, 1006]], width_cm: 5}
    - {name: CentralLeft.Blue, kind: special_zone, shape: polyline, polyline: [[1595, 240], [1774, 494]], width_cm: 5}
    - {name: SettleArea.Red, kind: settle_zone, polygon: [[1210, 774], [1210, 811], [1320, 900], [1437, 864], [1283, 701]]}
    - {name: SettleArea.Blue, kind: settle_zone, polygon: [[1590, 726], [1590, 689], [1480, 600], [1363, 636], [1517, 799]]}

unit_styles:
  friend:
    color: "#4cc38a"
    outline: "#000000"
  enemy:
    color: "#e85d5d"
    outline: "#000000"
  types:
    Hero:
      label: H
      radius: 9
    Engineer:
      label: E
      radius: 8
    Infantry1:
      label: I1
      radius: 7
    Infantry2:
      label: I2
      radius: 7
    Infantry3:
      label: I3
      radius: 7
    Drone:
      label: D
      radius: 8
    Sentry:
      label: S
      radius: 9
    default:
      label: "?"
      radius: 7

