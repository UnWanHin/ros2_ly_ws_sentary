target_rel_to_goal_pos_node:
  ros__parameters:
    input_topic: /ly/navi/target_rel
    input_goal_pos_raw_topic: /ly/navi/goal_pos_raw
    output_goal_pos_topic: /ly/navi/goal_pos
    output_goal_pose_topic: /goal_pose
    output_target_map_topic: /ly/navi/target_map
    output_target_official_topic: /ly/navi/target_official
    output_navi_position_topic: /ly/navi/position

    # TF frame settings
    map_frame: map
    base_frame: base_link
    fallback_base_frame: baselink
    # 追击 target_rel 在未携带 header.frame_id 时使用的默认来源坐标系。
    # 外部 aim 的 AimTarget point 默认在 gimbal_world：x-forward, y-left, z-up。
    # 实际转换路径为：source_frame -> map_frame（单段 TF 查询）。
    target_rel_default_frame: gimbal_world
    use_msg_frame_id: true

    publish_target_map: true
    publish_target_official: true
    publish_navi_position: true
    navi_position_publish_hz: 10.0
    # Legacy UInt16 output is disabled by default; /goal_pose is the final navigation target.
    publish_goal_pos: false
    # Publish geometry_msgs/PoseStamped directly to navigation after map-frame conversion.
    publish_goal_pose: true
    invert_y_axis: false
    y_axis_max_cm: 1500
    # Optional UInt16 encoding on output_goal_pos_topic when publish_goal_pos=true:
    #   u = sx * x_cm + ox
    #   v = sy * y_cm + oy
    # Navigation side decode:
    #   x_cm = (u - ox) / sx
    #   y_cm = (v - oy) / sy
    goal_pos_uint16_encode_enabled: false
    goal_pos_uint16_encode_x_scale: 1.0
    goal_pos_uint16_encode_y_scale: 1.0
    goal_pos_uint16_encode_x_offset_cm: 0.0
    goal_pos_uint16_encode_y_offset_cm: 0.0

    preferred_distance_cm: 300
    distance_deadband_cm: 50
    stop_when_no_target: true
    allow_reverse_goal: false
    enable_goal_pos_raw_bridge: true
    goal_pos_raw_frame: map

    # Raw goal static calibration (official-map points -> output map frame)
    # When enabled:
    #   /ly/navi/goal_pos_raw is treated as points in raw_goal_source_frame
    #   and converted by the configured matrix before publishing /goal_pose.
    # Model:
    #   matrix : use raw_goal_transform_matrix directly (row-major 4x4)
    #   rigid  : solve rotation + translation from point pairs
    #   affine : solve 2x2 linear + translation from point pairs
    #   auto   : solve both rigid/affine and choose lower RMSE (tie -> rigid)
    use_raw_goal_static_calibration: true
    raw_goal_calibration_model: matrix
    raw_goal_calibration_unit: m
    raw_goal_source_frame: official_map
    raw_goal_target_frame: map
    # Row-major 4x4 matrix. /ly/navi/goal_pos_raw is UInt16 cm, decoded to meters
    # before this meter-frame matrix is applied. /goal_pose is published in meters.
    raw_goal_transform_matrix: [
       0.061966691, -0.998078218, 0.000000000, 15.036385585,
       0.998078218, 0.061966691, 0.000000000, -24.836845501,
       0.000000000, 0.000000000, 1.000000000, 0.000000000,
       0.000000000, 0.000000000, 0.000000000, 1.000000000
    ]

    # Debug export (for comparing Area.hpp map points with TF-converted points)
    debug_export_point_pairs: true
    debug_points_reference_frame: map
    debug_area_header_file: ""
    debug_point_pairs_output_file: ""
