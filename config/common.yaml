# Shared startup options for launch wrapper scripts.
# Used by scripts/launch/start_sentry_all.sh for file logging and runtime defaults.
bt_file_log_enable: true
bt_log_dir: ~/Log/BT
aim_timer_log_enable: false
aim_timer_log_dir: ~/Log/AimTimer

# Predictor aiming output path. true uses ROS1-style immediate tracker callback output.
predictor:
  publish_on_tracker_callback: true

# Rosbag replay for sentry_all launch wrapper.
# When enabled, sentry_all starts `ros2 bag play <rosbag_path>`, forces virtual gimbal IO,
# and switches detector input to detector_config.use_ros_bag=true.
rosbag_play_enable: false
rosbag_path: ~/Log/rosbag

# gimbal_driver semantic control tuning.
# start_sentry_all.sh reads these and passes them as ROS parameters.
firecode_partial_hold_ms: 100
velocity_raw_to_mps: 0.025

# gimbal_driver raw serial diagnostics.
# Both channels are disabled by default.
gimbal_raw:
  # File log writes hex text to disk. Use only for short hardware debugging.
  file:
    enable: false
    uplink: true
    downlink: true
    screen: false
    flush: true
    dir: ~/Log/GimbalRaw
    type_ids: all

  # Topic log publishes binary bytes without hex/string conversion.
  topic:
    enable: false
    uplink: true
    downlink: true
    type_ids: all
