<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LY Sentry Architecture Browser</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      --bg: #0f1518;
      --panel: #182126;
      --panel-strong: #202b30;
      --line: #39494f;
      --text: #e7eeee;
      --muted: #9cafb2;
      --gold: #e0ad50;
      --cyan: #60bdcc;
      --green: #7bc492;
      --purple: #aa91d0;
      --rose: #dc8277;
    }
    * { box-sizing: border-box; }
    body { min-width: 320px; margin: 0; background: var(--bg); color: var(--text); }
    button, input { font: inherit; }
    button { cursor: pointer; }
    header {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      min-height: 67px; padding: 12px 20px; border-bottom: 1px solid var(--line); background: #131c20;
    }
    h1 { margin: 0; color: #f1ca78; font-size: 19px; letter-spacing: 0; }
    .subtitle, .muted { color: var(--muted); font-size: 13px; line-height: 1.5; }
    .subtitle { margin: 4px 0 0; }
    #status { max-width: 48%; color: #b8c8c9; font: 11px/1.4 ui-monospace, "Cascadia Code", monospace; text-align: right; }
    main { display: grid; grid-template-columns: 272px minmax(0, 1fr); height: calc(100vh - 67px); }
    aside { min-height: 0; overflow: auto; padding: 14px; border-right: 1px solid var(--line); background: #151e22; }
    .nav-label { margin: 16px 5px 7px; color: #7f989d; font: 11px ui-monospace, monospace; letter-spacing: .06em; text-transform: uppercase; }
    .nav-label:first-child { margin-top: 2px; }
    .nav-button, .result-button, .relation-button, .card, .node-card {
      border: 1px solid transparent; border-radius: 4px; background: transparent; color: var(--text); text-align: left;
    }
    .nav-button { display: block; width: 100%; padding: 9px 10px; }
    .nav-button:hover, .nav-button:focus, .nav-button.active { border-color: #4a6269; background: #26353a; color: #f6faf9; outline: none; }
    .nav-button.active { box-shadow: inset 3px 0 var(--gold); }
    input {
      width: 100%; padding: 9px 10px; border: 1px solid #4a5c62; border-radius: 4px;
      background: #10171a; color: var(--text); outline: none;
    }
    input:focus { border-color: var(--cyan); box-shadow: 0 0 0 2px #60bdcc26; }
    .results { margin: 8px 0 0; padding: 0; list-style: none; }
    .result-button { display: block; width: 100%; padding: 8px; border-bottom-color: #2b393e; }
    .result-button:hover, .result-button:focus { background: #26353a; outline: none; }
    .badge { display: inline-block; margin-bottom: 3px; color: var(--gold); font: 10px ui-monospace, monospace; }
    .workspace { min-width: 0; min-height: 0; overflow: auto; padding: 20px 24px 30px; }
    .breadcrumb { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 14px; color: var(--muted); font-size: 12px; }
    .breadcrumb button { padding: 0; border: 0; background: none; color: #9dd6dd; text-decoration: underline; }
    .breadcrumb span { color: #697e82; }
    h2 { margin: 0; font-size: 23px; }
    h3 { margin: 0; font-size: 15px; }
    .page-heading { display: flex; justify-content: space-between; gap: 16px; align-items: start; margin-bottom: 17px; }
    .page-heading p { max-width: 780px; margin: 6px 0 0; }
    .metric { flex: 0 0 auto; padding: 6px 8px; border: 1px solid var(--line); border-radius: 4px; color: var(--muted); font: 11px ui-monospace, monospace; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(235px, 1fr)); gap: 11px; }
    .card, .node-card { min-height: 126px; padding: 15px; border-color: var(--line); background: var(--panel); }
    .card:hover, .card:focus, .node-card:hover, .node-card:focus { border-color: #6d8d95; background: var(--panel-strong); outline: none; }
    .card .count { color: #f0c974; font: 22px ui-monospace, monospace; }
    .card p, .node-card p { margin: 7px 0 0; color: #b9c8ca; font-size: 12px; line-height: 1.55; }
    .card .card-kicker, .node-card .card-kicker { display: block; margin-bottom: 7px; color: var(--gold); font: 10px ui-monospace, monospace; text-transform: uppercase; }
    .section { margin-top: 26px; }
    .section-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 9px; }
    .section-heading span { color: var(--muted); font-size: 12px; }
    .node-card { min-height: 122px; }
    .node-card .node-name { display: block; overflow-wrap: anywhere; font-weight: 700; }
    .node-card .node-id { display: block; margin-top: 5px; overflow-wrap: anywhere; color: #839a9e; font: 10px/1.35 ui-monospace, monospace; }
    .empty { padding: 24px; border: 1px dashed #4a5d62; border-radius: 4px; color: var(--muted); }
    .detail-layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 15px; }
    .detail-main, .side-panel { border: 1px solid var(--line); border-radius: 5px; background: var(--panel); }
    .detail-main { padding: 18px; }
    .side-panel { align-self: start; padding: 14px; }
    .detail-type { margin: 7px 0; color: var(--gold); font: 11px ui-monospace, monospace; }
    .detail-id { overflow-wrap: anywhere; color: #95aeb2; font: 11px/1.45 ui-monospace, monospace; }
    .detail-summary { margin: 17px 0 0; line-height: 1.65; }
    .property-list { margin: 18px 0 0; padding: 0; list-style: none; }
    .property-list li { padding: 8px 0; border-top: 1px solid #2c3b40; color: #c8d4d5; font-size: 13px; }
    .property-list b { color: #88bfc8; }
    .local-graph { position: relative; min-height: 320px; margin-top: 20px; overflow: hidden; border: 1px solid #304249; border-radius: 4px; background-color: #11191c; background-image: linear-gradient(#23313755 1px, transparent 1px), linear-gradient(90deg, #23313755 1px, transparent 1px); background-size: 24px 24px; }
    .local-graph svg { display: block; width: 100%; height: 320px; }
    .graph-node { cursor: pointer; }
    .graph-node rect { stroke-width: 1.4; filter: drop-shadow(0 2px 3px #0008); }
    .graph-node text { fill: #f5f7f7; font: 12px "Noto Sans TC", "Microsoft JhengHei", sans-serif; pointer-events: none; }
    .local-edge { stroke: #73919a; stroke-width: 1.25; marker-end: url(#arrow); }
    .local-edge-label { fill: #9fb7ba; font: 10px ui-monospace, monospace; }
    .relation-button { display: block; width: 100%; margin: 7px 0 0; padding: 9px; border-color: #35474d; background: #1d292e; }
    .relation-button:hover, .relation-button:focus { border-color: #80a9b2; background: #26363c; outline: none; }
    .relation-button .direction { display: block; color: var(--gold); font: 10px ui-monospace, monospace; }
    .relation-button .relation-name { display: block; overflow-wrap: anywhere; margin-top: 3px; }
    .relation-button .relation-summary { display: block; overflow-wrap: anywhere; margin-top: 4px; color: #95aaad; font-size: 11px; line-height: 1.4; }
    .document { max-width: 1080px; }
    .document pre { white-space: pre-wrap; overflow-wrap: anywhere; margin: 14px 0 0; padding: 16px; border: 1px solid var(--line); border-radius: 4px; background: #131b1f; color: #d5dfdf; font: 12px/1.6 ui-monospace, "Cascadia Code", monospace; }
    .flow-tabs { display: flex; flex-wrap: wrap; gap: 7px; margin: 0 0 14px; }
    .flow-tab { padding: 8px 11px; border: 1px solid var(--line); border-radius: 4px; background: #19242a; color: #bdccce; }
    .flow-tab:hover, .flow-tab:focus, .flow-tab.active { border-color: #779da5; background: #2a3a40; color: #f1ca78; outline: none; }
    .flow-pane { min-height: 540px; padding: 20px; overflow: auto; border: 1px solid var(--line); border-radius: 5px; background-color: #121a1e; background-image: linear-gradient(#24323855 1px, transparent 1px), linear-gradient(90deg, #24323855 1px, transparent 1px); background-size: 24px 24px; }
    .flow-column { display: flex; flex-direction: column; align-items: center; gap: 11px; min-width: 850px; }
    .flow-row { display: flex; justify-content: center; gap: 12px; width: 100%; }
    .flow-arrow { color: #8da8ad; font: 18px ui-monospace, monospace; line-height: 1; }
    .flow-card { width: 195px; min-height: 72px; padding: 10px; border: 1px solid #608b94; border-radius: 4px; background: #1d2b30; color: #e9f0f0; text-align: left; }
    .flow-card:hover, .flow-card:focus { border-color: #f0c974; background: #2b3a3f; outline: none; }
    .flow-card.event { border-color: #cc7e72; background: #312426; }
    .flow-card.task { border-color: #baa066; background: #302c20; }
    .flow-card.output { border-color: #72b98b; background: #203126; }
    .flow-card small { display: block; margin-top: 5px; color: #adbec0; font-size: 11px; line-height: 1.35; }
    .flow-card .flow-kicker { display: block; color: #f2cb77; font: 10px ui-monospace, monospace; }
    .regional-layout { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 15px; align-items: start; }
    .regional-nav { position: sticky; top: 0; padding: 12px; border: 1px solid var(--line); border-radius: 5px; background: var(--panel); }
    .regional-nav button { display: block; width: 100%; margin-top: 6px; padding: 8px; border: 1px solid #34484e; border-radius: 4px; background: #1c282d; color: #c6d4d5; text-align: left; }
    .regional-nav button:hover, .regional-nav button:focus { border-color: #84aab3; background: #26363b; outline: none; }
    .regional-nav h3 { margin-top: 15px; color: #88abb1; font: 11px ui-monospace, monospace; text-transform: uppercase; }
    .regional-nav h3:first-child { margin-top: 0; }
    .bt-tree { min-width: 0; padding: 18px; border: 1px solid var(--line); border-radius: 5px; background-color: #121a1e; background-image: linear-gradient(#24323855 1px, transparent 1px), linear-gradient(90deg, #24323855 1px, transparent 1px); background-size: 24px 24px; }
    .bt-root { width: min(410px, 100%); margin: 0 auto 18px; padding: 12px; border: 2px solid #f0c974; border-radius: 5px; background: #302b1e; color: #fff3cf; text-align: center; }
    .bt-root small { display: block; margin-top: 5px; color: #d4c38f; font-size: 11px; }
    .bt-trunk { width: 2px; height: 25px; margin: 0 auto; background: #7799a0; }
    .bt-stage { position: relative; margin: 0 auto 12px; max-width: 900px; padding-left: 33px; }
    .bt-stage::before { position: absolute; top: 24px; bottom: -16px; left: 13px; width: 2px; background: #5a757c; content: ""; }
    .bt-stage:last-child::before { bottom: 32px; }
    .bt-stage::after { position: absolute; top: 24px; left: 13px; width: 20px; height: 2px; background: #5a757c; content: ""; }
    .bt-stage > details { border: 1px solid #56727a; border-radius: 5px; background: #1c292e; }
    .bt-stage > details[open] { border-color: #c39d61; }
    .bt-stage summary { display: flex; align-items: center; gap: 9px; padding: 11px 12px; cursor: pointer; list-style: none; }
    .bt-stage summary::-webkit-details-marker { display: none; }
    .bt-stage summary::before { color: #f0c974; content: "▸"; }
    .bt-stage details[open] summary::before { content: "▾"; }
    .bt-stage .stage-name { color: #f3f6f6; font-weight: 700; }
    .bt-stage .stage-meta { margin-left: auto; color: #9fb4b7; font: 11px ui-monospace, monospace; }
    .bt-stage .stage-description { padding: 0 12px 11px; color: #b9cacc; font-size: 12px; line-height: 1.5; }
    .bt-children { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px; padding: 0 12px 13px; }
    .bt-child { min-height: 72px; padding: 9px; border: 1px solid #3c545b; border-radius: 4px; background: #162126; color: #dce7e7; text-align: left; }
    .bt-child:hover, .bt-child:focus { border-color: #8cb5bd; background: #24343a; outline: none; }
    .bt-child .child-type { display: block; color: #e2b35b; font: 10px ui-monospace, monospace; }
    .bt-child small { display: block; margin-top: 5px; color: #9fb4b7; font-size: 11px; line-height: 1.4; }
    .bt-note { max-width: 900px; margin: 15px auto 0; padding: 10px; border-left: 3px solid #d48a75; background: #302325; color: #d9c2c2; font-size: 12px; line-height: 1.55; }
    @media (max-width: 820px) { .regional-layout { grid-template-columns: 1fr; } .regional-nav { position: static; } }
    .error { color: #ffaaa1; }
    @media (max-width: 960px) { .detail-layout { grid-template-columns: 1fr; } .side-panel { align-self: stretch; } }
    @media (max-width: 720px) {
      header { align-items: start; flex-direction: column; } #status { max-width: none; text-align: left; }
      main { display: block; height: auto; } aside { max-height: 285px; border-right: 0; border-bottom: 1px solid var(--line); }
      .workspace { min-height: calc(100vh - 352px); padding: 16px; } .page-heading { flex-direction: column; }
    }
  </style>
</head>
<body>
  <header>
    <div><h1>LY Sentry Architecture Browser</h1><p class="subtitle">分層瀏覽工程域、ROS topic、資料處理與局部關係。</p></div>
    <div id="status">正在讀取 source-checked graph…</div>
  </header>
  <main>
    <aside>
      <div class="nav-label">Architecture</div>
      <button class="nav-button" data-action="home">工程域</button>
      <button class="nav-button" data-action="catalog" data-category="topics">ROS topics</button>
      <button class="nav-button" data-action="catalog" data-category="processing">資料處理</button>
      <button class="nav-button" data-action="catalog" data-category="messages">Message schema</button>
      <button class="nav-button" data-action="catalog" data-category="regional">Regional 決策</button>
      <button class="nav-button" data-action="regional-flow">Regional 流程圖</button>
      <button class="nav-button" data-action="catalog" data-category="referee">串口與裁判</button>
      <div class="nav-label">Documents</div>
      <button class="nav-button" data-action="document" data-document="project">工程 Mermaid</button>
      <button class="nav-button" data-action="document" data-document="regional">Regional Mermaid</button>
      <div class="nav-label">Search</div>
      <input id="filter" type="search" placeholder="搜尋 topic、模組、檔案">
      <ul id="results" class="results"></ul>
    </aside>
    <section id="workspace" class="workspace"></section>
  </main>
  <script>
    const state = { graph: null, docs: {}, route: { view: "home" } };
    const svgNs = "http://www.w3.org/2000/svg";
    const typeColor = { module: "#50afbe", endpoint: "#dc9e3e", file: "#72bd87", config: "#a98ed0", schema: "#d57995", document: "#7899a5", concept: "#d47769", service: "#abb85c", tool: "#7dabb0" };
    const esc = value => String(value ?? "").replace(/[&<>"']/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[char]));
    const isTopic = node => node.type === "endpoint" && (node.tags || []).includes("ros_topic");
    const isReferee = node => /referee|serial|embedded|gimbal_driver|downlink|typeid|0x0/.test([node.id, node.name, node.summary, ...(node.tags || [])].join(" ").toLowerCase());
    const isRegional = node => /regional|behavior_tree|decision|posture|patrol|reach|\/ly\/navi|\/ly\/friend\/(hp|op_hp)|\/ly\/enemy\/(hp|op_hp)|damage_difference|sentry\/info|game\/path|gimbal_driver|navi_tf_bridge|sentry_position|map_path/.test([node.id, node.name, node.summary, node.filePath, ...(node.tags || [])].join(" ").toLowerCase());
    const categoryDefinitions = {
      topics: { title: "ROS topics", description: "所有 ROS topic。點進 topic 後可看 publisher、subscriber 與每條資料流語義。", test: isTopic },
      processing: { title: "資料處理", description: "模組、原始碼、launch/config 等會轉換、合成或決定資料的節點。", test: node => ["module", "file", "config", "service", "concept"].includes(node.type) && !node.id.startsWith("document:") },
      messages: { title: "Message schema", description: "ROS message 與 schema 定義；由它可跳到使用該資料的 topic 或處理節點。", test: node => node.type === "schema" },
      regional: { title: "Regional 決策", description: "Regional 決策、導航、reached、姿態、血量和相關的資料處理。", test: isRegional },
      referee: { title: "串口與裁判", description: "gimbal_driver、上/下行 frame、裁判資料映射及相關 ROS topic。", test: isReferee },
    };
    function nodesByLayer(layerId) {
      const layer = state.graph.layers.find(item => item.id === layerId); const ids = new Set(layer?.nodeIds || []);
      return state.graph.nodes.filter(node => ids.has(node.id));
    }
    function findNode(id) { return state.graph.nodes.find(node => node.id === id); }
    function nodeName(id) { return findNode(id)?.name || id; }
    function navigate(route) { state.route = route; updateNavigation(); render(); }
    function updateNavigation() {
      document.querySelectorAll(".nav-button").forEach(button => {
        const active = (button.dataset.action === "home" && state.route.view === "home") ||
          (button.dataset.action === "catalog" && state.route.view === "catalog" && button.dataset.category === state.route.category) ||
          (button.dataset.action === "regional-flow" && state.route.view === "regional-flow") ||
          (button.dataset.action === "document" && state.route.view === "document" && button.dataset.document === state.route.document);
        button.classList.toggle("active", active);
      });
    }
    function breadcrumb(items) {
      return `<nav class="breadcrumb">${items.map((item, index) => `${index ? "<span>›</span>" : ""}${item.route ? `<button data-route='${esc(JSON.stringify(item.route))}'>${esc(item.label)}</button>` : `<span>${esc(item.label)}</span>`}`).join("")}</nav>`;
    }
    function pageHeading(title, description, metric) {
      return `<div class="page-heading"><div><h2>${esc(title)}</h2><p class="muted">${esc(description)}</p></div>${metric ? `<div class="metric">${esc(metric)}</div>` : ""}</div>`;
    }
    function render() {
      const workspace = document.querySelector("#workspace");
      if (state.route.view === "home") renderHome(workspace);
      else if (state.route.view === "catalog") renderCatalog(workspace, state.route.category);
      else if (state.route.view === "layer") renderLayer(workspace, state.route.layerId);
      else if (state.route.view === "detail") renderDetail(workspace, state.route.nodeId);
      else if (state.route.view === "regional-flow") renderRegionalFlow(workspace, state.route.tab || "tick");
      else if (state.route.view === "document") renderDocument(workspace, state.route.document);
      bindRouteButtons(workspace);
    }
    function renderHome(workspace) {
      const layers = state.graph.layers || [];
      workspace.innerHTML = `${pageHeading("工程域", "先選你要看的系統邊界；這裡不把全部節點堆在同一張圖。", `${layers.length} domains`)}<div class="grid">${layers.map(layer => `<button class="card" data-route='${esc(JSON.stringify({ view: "layer", layerId: layer.id }))}'><span class="card-kicker">工程域</span><span class="count">${layer.nodeIds.length}</span><h3>${esc(layer.name)}</h3><p>${esc(layer.description || "無說明")}</p></button>`).join("")}</div><section class="section"><div class="section-heading"><h3>快速入口</h3><span>按資料種類收斂</span></div><div class="grid">${Object.entries(categoryDefinitions).map(([id, category]) => { const count = state.graph.nodes.filter(category.test).length; return `<button class="card" data-route='${esc(JSON.stringify({ view: "catalog", category: id }))}'><span class="card-kicker">目錄</span><span class="count">${count}</span><h3>${esc(category.title)}</h3><p>${esc(category.description)}</p></button>`; }).join("")}</div></section>`;
    }
    function renderCatalog(workspace, categoryId) {
      const category = categoryDefinitions[categoryId];
      if (!category) { navigate({ view: "home" }); return; }
      const nodes = state.graph.nodes.filter(category.test).sort((a, b) => a.name.localeCompare(b.name));
      workspace.innerHTML = `${breadcrumb([{ label: "工程域", route: { view: "home" } }, { label: category.title }])}${pageHeading(category.title, category.description, `${nodes.length} nodes`)}${nodeGrid(nodes)}`;
    }
    function renderLayer(workspace, layerId) {
      const layer = state.graph.layers.find(item => item.id === layerId);
      if (!layer) { navigate({ view: "home" }); return; }
      const nodes = nodesByLayer(layerId).sort((a, b) => a.name.localeCompare(b.name));
      const groups = [
        ["ROS topics", nodes.filter(isTopic)],
        ["資料處理", nodes.filter(node => ["module", "file", "config", "service", "concept"].includes(node.type))],
        ["Message schema", nodes.filter(node => node.type === "schema")],
        ["文件與工具", nodes.filter(node => ["document", "tool"].includes(node.type))],
      ].filter(([, items]) => items.length);
      workspace.innerHTML = `${breadcrumb([{ label: "工程域", route: { view: "home" } }, { label: layer.name }])}${pageHeading(layer.name, layer.description || "無說明", `${nodes.length} nodes`)}${groups.map(([title, items]) => `<section class="section"><div class="section-heading"><h3>${title}</h3><span>${items.length} nodes</span></div>${nodeGrid(items)}</section>`).join("")}`;
    }
    function nodeGrid(nodes) {
      return nodes.length ? `<div class="grid">${nodes.map(node => `<button class="node-card" data-route='${esc(JSON.stringify({ view: "detail", nodeId: node.id }))}'><span class="card-kicker">${esc(node.type)}</span><span class="node-name">${esc(node.name)}</span><span class="node-id">${esc(node.id)}</span><p>${esc(compact(node.summary || "無摘要", 126))}</p></button>`).join("")}</div>` : "<div class='empty'>這個範圍目前沒有 graph 節點。</div>";
    }
    function compact(value, length) { const text = String(value); return text.length > length ? `${text.slice(0, length - 1)}…` : text; }
    function renderDetail(workspace, nodeId) {
      const node = findNode(nodeId); if (!node) { navigate({ view: "home" }); return; }
      const incoming = state.graph.edges.filter(edge => edge.target === node.id);
      const outgoing = state.graph.edges.filter(edge => edge.source === node.id);
      const memberships = state.graph.layers.filter(layer => layer.nodeIds.includes(node.id));
      const parentLayer = memberships[0];

      }

    function appendGraphNode(svg, box, node, selected) {
